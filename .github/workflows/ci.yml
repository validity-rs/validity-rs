name: CI

# Pushes and pull requests are the gate. The weekly run on the default branch
# is the one that notices drift nobody committed: a new advisory, a distro
# package update, a registry change.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer push supersedes the run in flight for the same ref; scheduled and
# manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ride out transient crates.io blips instead of failing the job. Both are
  # forwarded into the containers by docker-compose.yml.
  CARGO_NET_RETRY: "10"

jobs:
  no-ai-traces:
    name: No AI traces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script checks every commit, so it needs all of them.
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages, added lines, paths and pull request text
        env:
          # Passed through the environment, never interpolated into the shell.
          # A bot's title and body are skipped: Renovate pastes upstream
          # release notes, which this project did not write. Its commits and
          # diff are still checked.
          PR_TITLE: ${{ github.event.pull_request.user.type != 'Bot' && github.event.pull_request.title || '' }}
          PR_BODY: ${{ github.event.pull_request.user.type != 'Bot' && github.event.pull_request.body || '' }}
        run: ci/run.sh noai

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned release binary, checked by SHA-256 in ci/run.sh. Reviewed false
      # positives are listed by fingerprint in .gitleaksignore.
      - run: ci/run.sh gitleaks
        env:
          CI_TOOLS: ${{ runner.temp }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/run.sh fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/run.sh clippy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image's preinstalled Rust can lag a release behind the
      # workspace's rust-version; install current stable explicitly.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # validity-daemon's integration tests start a private bus.
      - name: dbus-daemon
        run: command -v dbus-daemon || { sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon; }
      - run: ci/run.sh test

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: ci/run.sh doc

  msrv:
    # Keep in step with rust-version in Cargo.toml.
    name: MSRV (1.99.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: ci/run.sh msrv

  distro:
    name: Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      # One distro's registry timeout must not cancel the others.
      fail-fast: false
      matrix:
        distro: [debian, fedora, archlinux, alpine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/run.sh "distro:${{ matrix.distro }}"

  e2e:
    # The daemon with the emulated sensor on a system bus with polkit, driven
    # by fprintd's client tools and pam_fprintd (pamtester), in a container.
    name: End to end (fprintd clients, pam_fprintd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/run.sh e2e

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/run.sh deny
        env:
          CI_TOOLS: ${{ runner.temp }}
