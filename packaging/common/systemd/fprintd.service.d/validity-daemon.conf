# Installed by validity-daemon on Fedora and Arch Linux, where a package cannot
# divert another package's file. fprintd's D-Bus activation file stays as it
# is and starts fprintd.service (SystemdService=); with this drop-in that unit
# only starts validity-daemon.service, which then owns net.reactivated.Fprint.
# Removing validity-daemon removes this file, and fprintd is back.
[Unit]
Description=Hand-over to validity-daemon (fprintd's daemon is replaced)
Requires=validity-daemon.service
After=validity-daemon.service

[Service]
Type=oneshot
ExecStart=
ExecStart=/usr/bin/true
