[workspace]
resolver = "3"
members = ["crates/validity-proto", "crates/validity-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/validity-rs/validity-rs"

[workspace.lints.rust]
# No warning is tolerated: a plain `cargo build/test/clippy/doc` fails on any.
warnings = "deny"
unsafe_code = "forbid"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
