[package]
name = "validity-proto"
description = "Protocol for Synaptics/Validity match-on-chip fingerprint sensors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
hex = "0.4"
p256 = "0.14.0"
serde_json = "1.0.154"
sha2 = "0.11.1"

[dependencies]
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
hmac = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
sha2 = "0.11.1"
