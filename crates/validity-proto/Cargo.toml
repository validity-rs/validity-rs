[package]
name = "validity-proto"
description = "Protocol for Synaptics/Validity match-on-chip fingerprint sensors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
hex = "0.4"
hmac = "0.13.0"
p256 = "0.14.0"
serde_json = "1.0.154"
sha2 = "0.11.1"

[dependencies]
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
getrandom = "0.4.3"
hmac = "0.13.0"
log = "0.4.34"
nusb = { version = "0.2.8", optional = true }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
sha2 = "0.11.1"

[features]
default = ["usb"]
# The USB transport (nusb). Without it the crate is the protocol alone: parsers,
# channel, sensor logic and replay, which is what the fuzz targets build.
usb = ["dep:nusb"]

[[example]]
name = "probe"
required-features = ["usb"]

[[example]]
name = "session"
required-features = ["usb"]

[lints]
workspace = true
