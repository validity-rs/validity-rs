# cargo-mutants configuration. Every exclusion is an *equivalent* mutant (the change
# has no observable effect, so no test can catch it), except the last group: code
# that only runs against a real USB device. Each one is argued below; do not add
# an entry without the same.
# The workspace denies every warning, so a mutant that, say, replaces a function body
# leaves an unused import and fails to build: it would be counted "unviable" instead
# of being tested. Lints are not what mutation testing measures, so cap them here.
cap_lints = true

exclude_re = [
    # `while out.len() < len` vs `<=`: one extra HMAC block is computed, then the
    # output is truncated to `len`; the result is identical.
    "tls.rs:.*replace < with <= in prf",
    # `n > plain.len()` vs `>=`: when n == plain.len(), `plain.len() - n` is 0, which
    # fails the `< 0x60` check with the same BadPadding error.
    "tls.rs:.*replace > with >= in PskKeys::open_priv_blob",
    # `secure_tx && secure_rx` vs `||`: both flags are only ever set together within
    # a successful handshake, and a failed one resets both, so no caller can observe
    # one without the other.
    "channel.rs:.*replace && with \\|\\| in Channel::is_open",
    # `(a << 8) | x` vs `^` folding the SID authority bytes: the low 8 bits of
    # `a << 8` are zero and `x` is a byte, so the operands share no bit and `|`
    # equals `^`.
    "sid.rs:.*replace \\| with \\^ in Sid::from_bytes",
    # `hi << 4 | lo` vs `^` joining two hex nibbles: `lo` <= 0xf and the low 4 bits
    # of `hi << 4` are zero, so `|` equals `^`.
    "hex.rs:.*replace \\| with \\^ in decode",
    # The three `|` of `decode_insn` join disjoint bit fields, so `|` equals `^`:
    # `(op & 1) << 8` (bit 8) with a byte operand (bits 0-7), for Enable SO and
    # Disable SO; a low byte with `byte << 8`, for Register Write.
    "timeslot.rs:.*replace \\| with \\^ in decode_insn",
    # The three `(m << 2) | fuzzy(..)` of `metric`: `fuzzy` returns 0, 1 or 2
    # (bits 0-1) and the low two bits of `m << 2` are zero, so `|` equals `^`.
    "tables.rs:.*replace \\| with \\^ in SensorCaptureProg::metric",
    # `expected == ANY` vs `!=` in `fuzzy`: `fuzzy` is private and only scores the
    # constant CAPTURE_PROGRAMS, none of whose major, minor, build or u1 fields is
    # the 0xffff wildcard. For those, the original scores a field 2 (equal) or 0,
    # the mutant 2 or 1: the same order per field, and the metric compares fields
    # lexicographically (base-4 digits), so every comparison between candidates,
    # ties included, is unchanged; and `m > 0` holds either way because the major
    # field, filtered to be equal, scores 2. tests/proto_boundaries.rs checks the
    # selection against the reference over every table value (it would catch the
    # mutant if a wildcard entry were ever added).
    "tables.rs:.*replace == with != in fuzzy",
    # `b.len() < 0x4c` vs `<=`: at exactly 0x4c bytes, `resize(0x4c, 0)` is a no-op.
    "db.rs:.*replace < with <= in identity_to_bytes",
    # `count > 1` vs `>=` in `Line::transformed`: the only lines built (in
    # `line_update_type_1`) have count 2 or 3 (`cnt << 20`, with `pc + 1` below
    # 0x10000 since a timeslot table is a chunk of at most 0xffff bytes) or 0 (the
    # calibration lines, `i | 0x85 << 24` with i < 112). Count 1 never occurs.
    "scanner.rs:.*replace > with >= in Line::transformed",
    # The six `|` of `line_update_type_1` join disjoint bit fields, so `|` equals
    # `^`: `(pc + 1) | (cnt << 20) | 0x0700_0000` (pc + 1 <= 0xffff, as above;
    # cnt is 2 or 3: bits 20-21; bits 24-26), `(u - 1) | 8` (`bitpack` returns
    # 1 <= u <= 8, so u - 1 <= 7) and `i | (0x85 << 24)` (i < 112).
    "scanner.rs:.*replace \\| with \\^ in Scanner::line_update_type_1",
    # `b.len() > 24` vs `>=` in `message`: its only caller passes `line.trim_end()`,
    # so a line of exactly 24 bytes cannot end with the space that `b[23] == b' '`
    # requires; both versions then fall through to the `LEVEL:logger:` form.
    "replay.rs:.*replace > with >= in message",
    # validity-daemon `classify`: the arm `Channel(Transport(_)) => Lost` is
    # followed by `Channel(_) => Lost`, which matches the same errors with the
    # same result, so deleting the first arm changes nothing.
    "errors.rs:.*delete match arm ProtoError::Channel\\(validity_proto::channel::Error::Transport\\(_\\)\\) in classify",
    # `(e.mask << 1) | 1` vs `^ 1` in the emulator's enrolment update: the low
    # bit of `mask << 1` is zero, so `| 1` equals `^ 1`.
    "fake.rs:.*replace \\| with \\^ in FakeChip::enrollment_update",
    # `!st.waiting && self.capture == Capture::Waiting` vs `||` in the
    # emulator's finger wait: the loop is entered only with the capture
    # waiting and returns as soon as it changes, so the second operand is
    # always true there; the mutant only sets `waiting` again when it is
    # already set, with a notify_all that wakes waiters which re-check their
    # condition. (The regex also names the `&&` of the let chain a few lines
    # above, a mutant that does not build: a `let` is no operand of `||`.)
    "fake.rs:.*replace && with \\|\\| in <impl Sensor for FakeChip>::wait_for",
    # `FakeSensor::changed` (notify_all) with `()`: every waiter re-checks
    # within 10 ms without it. FakeChip::wait_for waits for a touch with
    # wait_timeout(10 ms) in a loop, and wait_for_capture waits for `waiting`,
    # whose setter notifies the condition variable itself. A lost notification
    # only delays a waiter by at most 10 ms, which no test can tell from
    # scheduling noise.
    "fake.rs:.*replace FakeSensor::changed with \\(\\)",
    # `Instant::now() < t` vs `<=` (the reappear window in Worker::probe): the
    # two differ only when the monotonic clock reads exactly the deadline, to
    # the nanosecond, where either answer (still expected back, or not) is
    # what "for this long" means.
    "worker.rs:.*replace < with <= in Worker<H>::probe",

    # Not equivalent, but unreachable without the hardware: the code below
    # talks to a real USB device (nusb endpoints, the device handle), which no
    # test can have without a supported sensor plugged in. The hardware probe
    # and session examples run it on the T480 (README, "Hardware tests").
    # Everything else in these files is tested without a sensor
    # (validity-proto's tests/sensor_defaults.rs: what find_supported returns,
    # the open_wait deadline; validity-daemon's usb tests: probe, open and
    # hotplug).
    #
    # validity-proto: the reply and image buffer sizes, used by the transfers
    # only; a found sensor (find_supported with no sensor returns nothing
    # anyway); the device's Debug; the transfers and the port reset; and
    # UsbLink, which forwards to them.
    "validity-proto/src/usb.rs:[0-9]+:[0-9]+: replace \\* with ",
    "validity-proto/src/usb.rs:.*replace find_supported -> .* with Ok\\(vec!\\[\\]\\)",
    "validity-proto/src/usb.rs:.*<impl core::fmt::Debug for UsbSensor>::fmt",
    "validity-proto/src/usb.rs:.*replace UsbSensor::(wait_int|read_82|reset) ",
    "validity-proto/src/usb.rs:.*<impl Transport for UsbSensor>::cmd",
    "session.rs:.*<impl UsbLink for UsbSensor>::",
    # validity-daemon: a sensor on the bus (without one, probe returns None
    # anyway, and with /sys/bus/usb present the sysfs check changes nothing);
    # the USB port reset.
    "validity-daemon/src/usb.rs:.*replace <impl Hardware for UsbHardware>::probe -> .* with Ok\\(None\\)",
    "validity-daemon/src/usb.rs:.*delete ! in <impl Hardware for UsbHardware>::probe",
    "validity-daemon/src/usb.rs:.*replace <impl Hardware for UsbHardware>::reset -> ",
]

